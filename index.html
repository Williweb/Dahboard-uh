<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Arte</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #f0f2f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0px 1px 5px rgba(0, 0, 0, .1);
        }

        .contenedor-centrado {
            text-align: center;
            margin-bottom: 15px;
        }

        .imagen-responsiva {
            max-width: 100%;
            height: auto;
        }

        .kpi {
            color: white;
            text-align: center;
            border-radius: 10px;
            padding: 20px;
        }

        .kpi h3 {
            font-size: 35px;
            font-weight: bold;
            margin: 0;
        }

        .table-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 1px 5px rgba(0, 0, 0, .1);
        }

        .icon-ok {
            color: #28a745;
            font-size: 18px;
        }

        .icon-no {
            color: #dc3545;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container-fluid p-4">

        <!-- ENCABEZADO -->
        <div class="header-card">
            <div class="contenedor-centrado">
                <img src="https://i.ibb.co/zy64X12/logo-uh.png" alt="Logo UH" class="imagen-responsiva" width="400">
            </div>
            <h2>Solicitudes de Arte</h2>
            <p>Seguimiento de solicitudes de artes</p>
        </div>

        <!-- KPI -->
        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <div class="kpi bg-warning">
                    <h3>12</h3>
                    <p>Pendientes</p>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="kpi bg-info">
                    <h3>5</h3>
                    <p>En Proceso</p>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="kpi bg-success">
                    <h3>34</h3>
                    <p>Finalizados</p>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="kpi bg-danger">
                    <h3>3</h3>
                    <p>Urgentes</p>
                </div>
            </div>
        </div>

        <!-- BOTONES -->
        <div class="d-flex justify-content-between mb-3">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalSolicitud">
                <i class="fa-solid fa-plus"></i> Nueva Solicitud
            </button>
            <button class="btn btn-success">
                <i class="fa-solid fa-file-excel"></i> Exportar Excel
            </button>
        </div>

        <!-- TABLA -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-secondary">
                        <tr>
                            <th>No.</th>
                            <th>Cliente</th>
                            <th>Producto</th>
                            <th>Fecha</th>
                            <th>Arte</th>
                            <th>Solicitado Por</th>
                            <th>Máquina</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaSolicitudes">
                        <tr>
                            <td><strong>UHI-1995</strong></td>
                            <td>LOS TRILLIZOS</td>
                            <td>ETIQUETA EXPORTACION</td>
                            <td>26/08/2026</td>
                            <td>
                                <i class="fa-solid fa-circle-check icon-ok"></i>
                            </td>
                            <td>FRANCISCO PEÑATE</td>
                            <td>SPS4</td>
                            <td>
                                <button class="btn btn-primary btn-sm" onclick='verFormulario("LOS TRILLIZOS", "ETIQUETA EXPORTACION", "FRANCISCO PEÑATE", "SPS4", "26/08/2026")'>
                                    <i class="fa-solid fa-print"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- MODAL -->
    <div class="modal fade" id="modalSolicitud" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Nueva Solicitud de Arte</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-with="modal" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <!-- CLIENTE -->
                        <div class="col-md-6">
                            <label class="form-label">Cliente</label>
                            <input type="text" id="cliente" class="form-control">
                        </div>
                        <!-- PRODUCTO -->
                        <div class="col-md-6">
                            <label class="form-label">Producto</label>
                            <input type="text" id="producto" class="form-control">
                        </div>
                        <!-- SOLICITADO POR -->
                        <div class="col-md-6">
                            <label class="form-label">Solicitado Por</label>
                            <input type="text" id="solicitadoPor" class="form-control">
                        </div>
                        <!-- MAQUINA -->
                        <div class="col-md-6">
                            <label class="form-label">Máquina</label>
                            <select id="maquina" class="form-select" onchange="actualizarColores()">
                                <option value="">Seleccionar</option>
                                <option value="SPS4">SPS4</option>
                                <option value="FIT">FIT</option>
                                <option value="ZTJ330">ZTJ330</option>
                                <option value="MARKANDY">MARKANDY</option>
                                <option value="DIGITAL">DIGITAL</option>
                            </select>
                        </div>
                        <!-- MATERIAL -->
                        <div class="col-md-6">
                            <label class="form-label">Material</label>
                            <select id="material" class="form-select">
                                <option>BOPP</option>
                                <option>PVC</option>
                                <option>SEMIBRILLANTE</option>
                                <option>TÉRMICO</option>
                                <option>PET-G</option>
                                <option>METALIZADO</option>
                                <option>FLUORESCENTE</option>
                                <option>COUCHE</option>
                                <option>BOND</option>
                            </select>
                        </div>
                        <!-- ACABADO -->
                        <div class="col-md-6">
                            <label class="form-label">Acabado</label>
                            <select id="acabado" class="form-select">
                                <option>Laminado</option>
                                <option>Barniz Brillante</option>
                                <option>Barniz Mate</option>
                            </select>
                        </div>
                        <!-- ANCHO -->
                        <div class="col-md-3">
                            <label class="form-label">Ancho</label>
                            <input type="text" id="ancho" class="form-control" placeholder='Ej: 8.5", 210 mm'>
                        </div>
                        <!-- LARGO -->
                        <div class="col-md-3">
                            <label class="form-label">Largo</label>
                            <input type="text" id="largo" class="form-control" placeholder='Ej: 12", 320 mm'>
                        </div>
                        <!-- PRESENTACION -->
                        <div class="col-md-3">
                            <label class="form-label">Rollos / Hojas</label>
                            <select id="presentacion" class="form-select">
                                <option>ROLLOS</option>
                                <option>HOJAS</option>
                            </select>
                        </div>
                        <!-- SALIDA -->
                        <div class="col-md-3">
                            <label class="form-label">Salida de Rollo</label>
                            <select id="salidaRollo" class="form-select">
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                                <option>5</option>
                                <option>6</option>
