<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solicitudes de Arte</title>

<!-- Bootstrap -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<!-- FontAwesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#f0f2f5;
    font-family:Arial, Helvetica, sans-serif;
}

.header-card{
    background:white;
    padding:25px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0px 1px 5px rgba(0,0,0,.1);
}

.contenedor-centrado{
    text-align:center;
    margin-bottom:15px;
}

.imagen-responsiva{
    max-width:100%;
    height:auto;
}

.kpi{
    color:white;
    text-align:center;
    border-radius:10px;
    padding:20px;
}

.kpi h3{
    font-size:35px;
    font-weight:bold;
    margin:0;
}

.table-card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 1px 5px rgba(0,0,0,.1);
}

.icon-ok{
    color:#28a745;
    font-size:18px;
}

.icon-no{
    color:#dc3545;
    font-size:18px;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

    <!-- ENCABEZADO -->

    <div class="header-card">

        <div class="contenedor-centrado">

    <img
        src="https://i.ibb.co/zy64X12/logo-uh.png"
        alt="Logo UH"
        class="imagen-responsiva"
        width="400">

</div>


        <h2>Solicitudes de Arte</h2>

        <p>
            Seguimiento de solicitudes de artes
        </p>

    </div>

    <!-- KPI -->

    <div class="row mb-4">

        <div class="col-md-3 mb-3">
            <div class="kpi bg-warning">
                <h3>12</h3>
                <p>Pendientes</p>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="kpi bg-info">
                <h3>5</h3>
                <p>En Proceso</p>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="kpi bg-success">
                <h3>34</h3>
                <p>Finalizados</p>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="kpi bg-danger">
                <h3>3</h3>
                <p>Urgentes</p>
            </div>
        </div>

    </div>

    <!-- BOTONES -->

    <div class="d-flex justify-content-between mb-3">

        <button class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#modalSolicitud">

            <i class="fa-solid fa-plus"></i>
            Nueva Solicitud

        </button>

        <button class="btn btn-success">

            <i class="fa-solid fa-file-excel"></i>
            Exportar Excel

        </button>

    </div>

    <!-- TABLA -->

    <div class="table-card">

        <div class="table-responsive">

            <table class="table table-striped table-hover">

                <thead class="table-secondary">

                    <tr>
                        <th>No.</th>
                        <th>Cliente</th>
                        <th>Producto</th>
                        <th>Fecha</th>
                        <th>Arte</th>
                        <th>Solicitado Por</th>
                        <th>Máquina</th>
                        <th>Acciones</th>
                    </tr>

                </thead>

                <tbody id="tablaSolicitudes">

                    <tr>

                        <td><strong>UHI-1995</strong></td>
                        <td>LOS TRILLIZOS</td>
                        <td>ETIQUETA EXPORTACION</td>
                        <td>26/08/2026</td>

                        <td>
                            <i class="fa-solid fa-circle-check icon-ok"></i>
                        </td>

                        <td>FRANCISCO PEÑATE</td>

                        <td>SPS4</td>

                        <td>

                            <button
    class="btn btn-primary btn-sm"
    onclick='verFormulario(

        "ETIQUETA EXPORTACION",
        "FRANCISCO PEÑATE",
        "SPS4",
        "26/08/2026"
    )'>

    <i class="fa-solid fa-print"></i>

</button>
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- MODAL -->

<div class="modal fade"
id="modalSolicitud"
tabindex="-1">

<div class="modal-dialog modal-xl">

<div class="modal-content">

<div class="modal-header bg-primary text-white">

<h5 class="modal-title">
Nueva Solicitud de Arte
</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<div class="row g-3">

    <!-- CLIENTE -->

 <div class="col-md-6">
    <label class="form-label">Cliente</label>
    <input type="text"
           id="cliente"
           class="form-control">
</div>

    <!-- PRODUCTO -->

    <div class="col-md-6">
    <label class="form-label">Producto</label>
    <input type="text"
           id="producto"
           class="form-control">
</div>

    <!-- SOLICITADO POR -->

  <div class="col-md-6">

    <label class="form-label">
        Solicitado Por
    </label>

    <input type="text"
           id="solicitadoPor"
           class="form-control">

</div>


    <!-- MAQUINA -->

    <div class="col-md-6">

        <label class="form-label">Máquina</label>

        <select id="maquina"
                class="form-select"
                onchange="actualizarColores()">

            <option value="">Seleccionar</option>

            <option value="SPS4">SPS4</option>
            <option value="FIT">FIT</option>
            <option value="ZTJ330">ZTJ330</option>
            <option value="MARKANDY">MARKANDY</option>
            <option value="DIGITAL">DIGITAL</option>

        </select>

    </div>

    <!-- MATERIAL -->

    <div class="col-md-6">

    <label class="form-label">Material</label>

    <select id="material"
            class="form-select">

        <option>BOPP</option>
        <option>PVC</option>
        <option>SEMIBRILLANTE</option>
        <option>TERMICO</option>
        <option>PET-G</option>
        <option>METALIZADO</option>
        <option>FLUORECENTE</option>
        <option>COUCHE</option>
        <option>BOND</option>

</div>
    <!-- ACABADO -->

    <div class="col-md-6">

    <label class="form-label">Acabado</label>

    <select id="acabado"
            class="form-select">

        <option>Laminado</option>
        <option>Barniz Brillante</option>
        <option>Barniz Mate</option>

    </select>

</div>

    <!-- ANCHO -->

    <div class="col-md-3">

        <label class="form-label">Ancho</label>

        <input type="text"
       id="ancho"
       class="form-control"
       placeholder='Ej: 8.5", 210 mm'>

    </div>

    <!-- LARGO -->

    <div class="col-md-3">

        <label class="form-label">Largo</label>

        <input type="text"
       id="largo"
       class="form-control"
       placeholder='Ej: 12", 320 mm'>

    </div>

    <!-- PRESENTACION -->

    <div class="col-md-3">

        <label class="form-label">Rollos / Hojas</label>

       <select id="presentacion"
        class="form-select">


            <option>ROLLOS</option>
            <option>HOJAS</option>

        </select>
       

    </div>

    <!-- SALIDA -->

    <div class="col-md-3">

        <label class="form-label">Salida de Rollo</label>

         <select id="salidaRollo"
        class="form-select">


            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>

        </select>
       
    </div>

    <!-- CORNER -->

    <div class="col-md-4">

        <label class="form-label">
            Corner Radio
        </label>

         <select id="cornerRadio"
        class="form-select">

            <option value="">
                Seleccionar
            </option>

            <option>1/32"</option>
            <option>1/16"</option>
            <option>1/8"</option>
            <option>1/4"</option>
            <option>1/2"</option>

        </select>
       

    </div>

    <!-- TROQUEL -->

    <div class="col-md-4">

        <label class="form-label">
            Troquel
        </label>
 <select id="troquel"
        class="form-select">

            <option>Ninguno</option>
            <option>Forma Especial</option>

        </select>
       

    </div>

    
    <!-- COLORES -->

    <div class="col-md-12 mt-3">

        <h6>
            Colores
        </h6>

    </div>

    <div class="col-md-3">
        <label>Color 1</label>
        <input type="text" id="color1" class="form-control">
    </div>

    <div class="col-md-3">
        <label>Color 2</label>
        <input type="text" id="color2" class="form-control">
    </div>

    <div class="col-md-3">
        <label>Color 3</label>
        <input type="text" id="color3" class="form-control">
    </div>

    <div class="col-md-3">
        <label>Color 4</label>
        <input type="text" id="color4" class="form-control">
    </div>

    <div class="col-md-3">
        <label>Color 5</label>
        <input type="text" id="color5" class="form-control">
    </div>

    <div class="col-md-3">
        <label>Color 6</label>
        <input type="text" id="color6" class="form-control">
    </div>

    <div class="col-md-3">
        <label>Color 7</label>
        <input type="text" id="color7" class="form-control">
    </div>

    <div class="col-md-3">
        <label>Color 8</label>
        <input type="text" id="color8" class="form-control">
    </div>

    <!-- ARCHIVO -->

    <div class="col-md-12">

        <label class="form-label">
            Adjuntar Referencia
        </label>

        <input type="file"
       id="adjunto"
       class="form-control"
       accept=".pdf,.jpg,.jpeg,.png,.ai,.cdr">

    </div>
    

    <!-- OBS -->

    <div class="col-md-12">

        <label class="form-label">
            Observaciones
        </label>

        <textarea
    id="observaciones"
    class="form-control"
    rows="4"></textarea>

    </div>


</div>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Cancelar

</button>

<button class="btn btn-success"
        onclick="guardarSolicitud()">
    Guardar Solicitud
</button>

</div>

</div>

</div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

function verFormulario(
    cliente,
    producto,
    solicitadoPor,
    maquina,
    fecha
){

    const ventana =
        window.open(
            "",
            "_blank",
            "width=900,height=800"
        );

    ventana.document.write(`

    <html>

    <head>

        <title>
            Solicitud de Arte
        </title>

        <style>

            body{
                font-family:Arial;
                padding:30px;
            }

            .logo{
                text-align:center;
            }

            h1{
                text-align:center;
                margin-top:10px;
            }

            table{
                width:100%;
                border-collapse:collapse;
                margin-top:20px;
            }

            td{
                border:1px solid #000;
                padding:8px;
            }

            .acciones{
                margin-top:20px;
                text-align:center;
            }

            button{

                background:#0d6efd;
                color:white;

                border:none;
                padding:10px 20px;

                cursor:pointer;

                margin-right:10px;
            }

        </style>

    </head>

    <body>

        <div class="logo">

    <img
        src="https://i.ibb.co/zy64X12/logo-uh.png"
        alt="Logo UH"
        class="imagen-responsiva"
        width="350">

        </div>

        <h1>
            SOLICITUD DE ARTE
        </h1>

        <table>

            <tr>
                <td><b>Cliente</b></td>
                <td>${cliente}</td>
            </tr>

            <tr>
                <td><b>Producto</b></td>
                <td>${producto}</td>
            </tr>

            <tr>
                <td><b>Solicitado Por</b></td>
                <td>${solicitadoPor}</td>
            </tr>

            <tr>
                <td><b>Máquina</b></td>
                <td>${maquina}</td>
            </tr>

            <tr>
                <td><b>Fecha</b></td>
                <td>${fecha}</td>
            </tr>

        </table>

        <div class="acciones">

            <button onclick="window.print()">
                Imprimir
            </button>

        </div>

    </body>

    </html>

    `);

    ventana.document.close();

}
function obtenerSiguienteCorrelativo(){

    const filas =
        document.querySelectorAll(
            "#tablaSolicitudes tr"
        );

    let ultimo = 0;

    filas.forEach(fila => {

        const codigo =
            fila.cells[0].innerText.trim();

        const numero =
            parseInt(
                codigo.replace("UHI-", "")
            );

        if(numero > ultimo){

            ultimo = numero;

        }

    });

    return ultimo + 1;
}

function actualizarColores(){

    const maquina =
        document.getElementById("maquina").value;

    let max = 0;

    switch(maquina){

        case "MARKANDY":
            max = 1;
            break;

        case "FIT":
            max = 6;
            break;

        case "SPS4":
            max = 8;
            break;

        case "ZTJ330":
            max = 5;
            break;

        case "DIGITAL":
            max = 4;
            break;
    }

    for(let i = 1; i <= 8; i++){

        const campo =
            document.getElementById("color" + i);

        if(!campo) continue;

        if(i <= max){

            campo.disabled = false;

        }else{

            campo.disabled = true;
            campo.value = "";

        }

    }

}

function guardarSolicitud(){

    // DATOS BÁSICOS

    const cliente =
        document.getElementById("cliente").value.trim();

    const producto =
        document.getElementById("producto").value.trim();

    const solicitadoPor =
        document.getElementById("solicitadoPor").value.trim();

    const maquina =
        document.getElementById("maquina").value;

    // VALIDACIONES

    if(cliente === ""){

        alert("Ingrese el Cliente");
        return;
    }

    if(producto === ""){

        alert("Ingrese el Producto");
        return;
    }

    if(solicitadoPor === ""){

        alert("Ingrese Solicitado Por");
        return;
    }

    if(maquina === ""){

        alert("Seleccione una máquina");
        return;
    }

    // GENERAR CORRELATIVO

    const correlativo =
        obtenerSiguienteCorrelativo();

    const fecha =
        new Date().toLocaleDateString("es-SV");

    // OBJETO COMPLETO

    const solicitud = {

        codigo:`UHI-${correlativo}`,

        fecha,

        cliente,
        producto,
        solicitadoPor,

        maquina,

        material:
            document.getElementById("material").value,

        acabado:
            document.getElementById("acabado").value,

        ancho:
            document.getElementById("ancho").value,

        largo:
            document.getElementById("largo").value,

        presentacion:
            document.getElementById("presentacion").value,

        salidaRollo:
            document.getElementById("salidaRollo").value,

        cornerRadio:
            document.getElementById("cornerRadio").value,

        troquel:
            document.getElementById("troquel").value,

        color1:
            document.getElementById("color1").value,

        color2:
            document.getElementById("color2").value,

        color3:
            document.getElementById("color3").value,

        color4:
            document.getElementById("color4").value,

        color5:
            document.getElementById("color5").value,

        color6:
            document.getElementById("color6").value,

        color7:
            document.getElementById("color7").value,

        color8:
            document.getElementById("color8").value,

        observaciones:
            document.getElementById("observaciones").value

    };

    // GUARDAR EN GOOGLE SHEETS

const formData =
    new FormData();

for(const key in solicitud){

    formData.append(
        key,
        solicitud[key]
    );

}

fetch(
"https://script.google.com/macros/s/AKfycbyigAM8-GtuHBS5Dn5RXejga9I8RNxkGqo9DLfmvxlG6NeLozpqBgX8K3pjmUCUHBZ0/exec",
{
    method:"POST",
    body:formData
})
.then(() => {

    console.log(
        "Guardado correctamente"
    );

})
.catch(error => {

    console.error(error);

});
.then(() => {

  console.log(
    "Solicitud enviada"
  );

})
.catch(error => {

  console.error(
    error
  );

});


    // AGREGAR FILA AL DASHBOARD

    const nuevaFila = `

    <tr>

        <td>
            <strong>UHI-${correlativo}</strong>
        </td>

        <td>${cliente}</td>

        <td>${producto}</td>

        <td>${fecha}</td>

        <td>
            <i class="fa-solid fa-circle-xmark icon-no"></i>
        </td>

        <td>${solicitadoPor}</td>

        <td>${maquina}</td>

        <td>

            <button
                class="btn btn-primary btn-sm">

                <i class="fa-solid fa-print"></i>

            </button>

        </td>

    </tr>

    `;

    document
        .getElementById("tablaSolicitudes")
        .insertAdjacentHTML(
            "beforeend",
            nuevaFila
        );

    // LIMPIAR

    document.getElementById("cliente").value = "";
    document.getElementById("producto").value = "";
    document.getElementById("solicitadoPor").value = "";

    document.getElementById("maquina").selectedIndex = 0;
    document.getElementById("material").selectedIndex = 0;
    document.getElementById("acabado").selectedIndex = 0;

    document.getElementById("ancho").value = "";
    document.getElementById("largo").value = "";

    document.getElementById("presentacion").selectedIndex = 0;
    document.getElementById("salidaRollo").selectedIndex = 0;
    document.getElementById("cornerRadio").selectedIndex = 0;
    document.getElementById("troquel").selectedIndex = 0;

    document.getElementById("observaciones").value = "";

    for(let i = 1; i <= 8; i++){

        document.getElementById(
            "color" + i
        ).value = "";
    }

    actualizarColores();

    bootstrap.Modal
        .getInstance(
            document.getElementById(
                "modalSolicitud"
            )
        )
        .hide();
}

function imprimirFormulario(){

    alert("Imprimir funcionando");

}

document.addEventListener(
    "DOMContentLoaded",
    actualizarColores
);

</script>
</body>
</html>
